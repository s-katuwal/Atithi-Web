<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Atithi</title>
  <meta name="theme-color" content="#1774BC">
  <link rel="icon" href="/images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Mukta:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="gallery">
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="page-hero-wrap container">
      <div class="inner">
        <img class="logo" src="/images/logo-atithi.jpg" data-c-src="site_logo" alt="Atithi logo">
        <div style="flex:1">
          <div class="eyebrow left">Photos</div>
          <h1 data-c="gallery_title">Gallery</h1>
          <p data-c="gallery_text">Rooms, food, celebrations and moments from all three Atithi branches.</p>
        </div>
      </div>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="menu-tabs" id="galleryTabs"></div>
      <div class="gallery-grid" id="galleryGrid"><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
